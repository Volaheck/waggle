name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: waggle
          POSTGRES_PASSWORD: waggle
          POSTGRES_DB: waggle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waggle -d waggle"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://waggle:waggle@localhost:5432/waggle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:web
