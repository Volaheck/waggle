name: waggle-bot

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: waggle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: waggle
    volumes:
      - db-data:/var/lib/postgresql/data
    # A name of its own: when the bot also joins a reverse proxy's network (docker-compose.override.yml),
    # a plain "db" could resolve to another project's database there.
    networks:
      default:
        aliases: [waggle-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waggle -d waggle"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://waggle:${POSTGRES_PASSWORD}@waggle-db:5432/waggle
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT:-8787}:8787"
    mem_limit: 384m

  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h waggle-db -U waggle waggle | gzip > /backups/waggle-$$(date +%F).sql.gz
          find /backups -name 'waggle-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 64m

volumes:
  db-data:
