name: waggle-bot

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: waggle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: waggle
    volumes:
      - db-data:/var/lib/postgresql/data
    # A name of its own: when the bot also joins a reverse proxy's network (docker-compose.override.yml),
    # a plain "db" could resolve to another project's database there.
    networks:
      default:
        aliases: [waggle-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waggle -d waggle"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://waggle:${POSTGRES_PASSWORD}@waggle-db:5432/waggle
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT:-8787}:8787"
    # On stop the bot first lets the chronicler call under way finish, for up to 40 s (see shutdown in src/main.ts).
    stop_grace_period: 70s
    mem_limit: 384m

  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    # A daily dump replaces nothing until pg_dump has succeeded, and old dumps are pruned only after a success,
    # so a failing dump (the database still starting after a reboot, a full disk, …) never eats the good ones.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        trap 'exit 0' TERM INT
        pause() { sleep "$$1" & wait $$!; }
        while :; do
          until pg_isready -q -h waggle-db -U waggle -d waggle; do pause 10; done
          file="/backups/waggle-$$(date +%F).dump"
          if pg_dump -h waggle-db -U waggle -Fc -f /backups/.in-progress.dump waggle; then
            mv /backups/.in-progress.dump "$$file"
            find /backups -maxdepth 1 \( -name 'waggle-*.dump' -o -name 'waggle-*.sql.gz' \) -mtime +14 -delete
            echo "backup: saved $$file"
            pause 86400
          else
            rm -f /backups/.in-progress.dump
            echo "backup: FAILED, pg_dump did not finish. Older dumps are kept; next try in an hour." >&2
            pause 3600
          fi
        done
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m

volumes:
  db-data:
